#cloud-config
package_update: true
packages:
  - git

runcmd:
  - git clone https://github.com/ecomod-code/rstudio-code-server.git /srv/ecomod-server
  - chown -R cloud:cloud /srv/ecomod-server
  - |
      cat >/srv/ecomod-server/.env <<'EOF'
      SERVER_URL=example.domain.tld
      ACME_EMAIL=admin@example.org
      USER_PASSWORD='CHANGE_ME'
      TZ=Europe/Berlin
      PUID=1000
      PGID=1000
      EOF
  - chown cloud:cloud /srv/ecomod-server/.env
  - chmod 600 /srv/ecomod-server/.env
  - bash /srv/ecomod-server/scripts/install-prereqs.sh
  - usermod -aG docker cloud || true
  - bash /srv/ecomod-server/scripts/start-stack.sh
  # Monitoring agent; port 9100 stays closed unless the VM gets the
  # monitoring security group.
  - bash /srv/ecomod-server/scripts/setup-monitoring-agent.sh
  # Optional Nextcloud sync. Leave the values empty to skip it; enable it later
  # on the VM with /srv/ecomod-server/scripts/setup-nextcloud-sync.sh
  - >-
      NC_URL=''
      NC_USER=''
      NC_APP_PASSWORD=''
      NC_REMOTE_PATH='/RStudio-Server'
      bash /srv/ecomod-server/scripts/setup-nextcloud-sync.sh

final_message: |
  ecomod deployment finished.
  Stack in /srv/ecomod-server

# install-prereqs.sh runs apt upgrade; a new kernel only takes effect after a
# reboot. Runs after runcmd and final_message, and only when Ubuntu flags it.
power_state:
  mode: reboot
  message: "Rebooting to activate updates installed during provisioning"
  condition: test -f /var/run/reboot-required
