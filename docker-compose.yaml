services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - rstudio
      - code-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./volumes/caddy_data:/data
      - ./volumes/caddy_config:/config
    environment:
      - SERVER_URL=${SERVER_URL}
      - ACME_EMAIL=${ACME_EMAIL}
    networks:
      - ecomod

  rstudio:
    image: ecomod/rstudio:latest
    restart: unless-stopped
    expose:
      - "8787"
    volumes:
      - ./volumes/workspace:/home/rstudio
    environment:
      - USER=rstudio
      - PASSWORD=${USER_PASSWORD}
      - TZ=${TZ}
    networks:
      - ecomod

  code-server:
    image: ecomod/code-server:latest
    restart: unless-stopped
    expose:
      - "8443"
    volumes:
      # /config is linuxserver's own state dir (settings, extensions, .ssh,
      # .bashrc). Keep it separate so it does not litter the researcher's home.
      - ./volumes/code_config:/config
      # The shared workspace. code-server opens DEFAULT_WORKSPACE, which
      # defaults to /config/workspace, so mounting here means VS Code lands on
      # exactly the directory RStudio has as /home/rstudio.
      - ./volumes/workspace:/config/workspace
    environment:
      - PASSWORD=${USER_PASSWORD}
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - ecomod

networks:
  ecomod:
    driver: bridge
    # MTU is set daemon-wide by scripts/install-prereqs.sh via
    # default-network-opts, so it applies here without a per-network option.
